[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-resume-win"
version = "0.1.0"
description = "A native Windows TUI for browsing and resuming local Codex sessions across accounts"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "sunofch"}]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sunofch/codex-resume-win"
Issues = "https://github.com/sunofch/codex-resume-win/issues"

[project.scripts]
codex-resume = "codex_resume:cli"

[tool.setuptools]
py-modules = ["codex_resume", "terminal_ui"]
